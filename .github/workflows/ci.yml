name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-senha-descartavel
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: ledger
      DB_PASSWORD: ci-senha-descartavel
      DB_NAME: ledger

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Gerar o segredo do JWT
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Rodar os testes
        run: ./mvnw --batch-mode test

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Criar o .env a partir do exemplo
        run: cp .env.example .env

      - name: Subir tudo do zero
        run: docker compose up -d --build --wait

      - name: Conferir que o app responde
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" localhost:8080/me || true)
            echo "tentativa $i: $codigo"
            if [ "$codigo" = "401" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Mostrar os logs se algo falhou
        if: failure()
        run: docker compose logs

      - name: Derrubar tudo
        if: always()
        run: docker compose down -v
